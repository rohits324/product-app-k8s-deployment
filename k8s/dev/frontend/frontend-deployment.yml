kind: Deployment
apiVersion: apps/v1
metadata:
  name: frontend-deployment
  namespace: dev-namespace

spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-product-app
  template:
    metadata:
      labels:
        app: frontend-product-app

    spec:
      containers:
        - name: frontend-container
          image: rohitkumar4praja/product-app:latest
          ports:
            - containerPort: 80
